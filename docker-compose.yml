services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data:/app/data
      - ./Upload:/app/uploads
    networks:
      - flashcards-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - flashcards-net
    restart: unless-stopped

networks:
  flashcards-net:
    driver: bridge
